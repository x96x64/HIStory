name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.x"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the audio tools
        run: brew install ffmpeg flac exiftool
      - name: Install the package
        run: python -m pip install -e '.[test]' pyflakes
      - name: Check the code
        run: python -m pyflakes hist tests
      - name: Run the tests
        run: python -m pytest
